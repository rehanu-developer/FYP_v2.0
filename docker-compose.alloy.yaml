services:
  api:
    image: python:3.12-slim-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - alloy-pip-cache:/root/.cache/pip
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    command: >
      bash -lc "
        set -euo pipefail;
        pip install --no-cache-dir
          'fastapi>=0.115'
          'uvicorn[standard]>=0.30'
          'pydantic>=2.7'
          'httpx>=0.27'
          'python-dotenv>=1.0';
        exec python -m uvicorn backend.api.database:app --host 0.0.0.0 --port 8000
      "

volumes:
  alloy-pip-cache:
