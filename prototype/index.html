<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteOps Cloud — Community Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#14161a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13a4 4 0 0 1 0 8h-1"/><path d="M4 8v8a4 4 0 0 0 4 4h5a4 4 0 0 0 4-4"/>
            <path d="M7 3v2M11 3v2M15 3v2"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">RouteOps Cloud</span>
          <span class="brand-sub">Community Coffee</span>
        </div>
      </div>

      <div class="nav-label">Planning</div>
      <button class="nav-item active" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-nav="ingestion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span>Data Ingestion</span>
      </button>
      <button class="nav-item" data-nav="session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>
        <span>Routing Sessions</span>
      </button>
      <button class="nav-item" data-nav="planner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.5 2V6L9 4m0 16l6-2m-6 2V4m6 14l5.5 2V4L15 6m0 12V6m0 0L9 4"/></svg>
        <span>Route Planner</span>
      </button>
      <button class="nav-item" data-nav="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        <span>Exports</span>
      </button>

      <div class="nav-label">Reference</div>
      <button class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
        <span>Master Data</span>
      </button>
      <button class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        <span>Reports</span>
      </button>
      <button class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.5 1.5c0 1.5-2 2-2 3"/><path d="M12 17h.01"/></svg>
        <span>Support</span>
      </button>

      <div class="sidebar-spacer"></div>

      <div class="profile">
        <div class="profile-avatar">MR</div>
        <div class="profile-text">
          <div class="profile-name">Michael Reeves</div>
          <div class="profile-role">Routing Analyst</div>
          <div class="profile-org">Community Coffee</div>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main" id="main">
      <!-- screens injected below -->
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Create Option modal -->
  <div class="modal-overlay" id="optionModal">
    <div class="modal">
      <h2>Create Routing Option</h2>
      <p class="msub">Create a working copy to test route changes without modifying the baseline.</p>
      <div class="field">
        <label class="field-label">Option Name</label>
        <input class="text-input" value="Option 1" />
      </div>
      <div class="field">
        <label class="field-label">Description</label>
        <input class="text-input" value="Working copy for Baton Rouge route balancing." />
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label">Create From</label>
        <select class="select"><option>Baseline</option></select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="closeModal(); go('planner')">Create and Open Planner</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
